<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circumference and Area of Circles — Mr. McLean Math</title>
<style>
  :root{
    --bg:#f5f6f8;
    --panel:#ffffff;
    --text:#202124;
    --muted:#666b73;
    --border:#d9dde3;
    --accent:#1976d2;
    --accent-soft:#e8f1fb;
    --good:#247a3b;
    --bad:#b3261e;
    --focus:#f5b400;
    --diagram:#3f4348;
    --area-fill:#dff3df;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    line-height:1.45;
  }
  body.high-contrast{
    --bg:#000;--panel:#080808;--text:#fff;--muted:#ddd;--border:#777;
    --accent:#00d7ff;--accent-soft:#111;--good:#68ff8b;--bad:#ff7474;
    --focus:#ffea00;--diagram:#fff;--area-fill:#111;
  }
  .app{max-width:900px;margin:0 auto;padding:18px}
  header{
    display:flex;justify-content:space-between;align-items:center;
    gap:12px;flex-wrap:wrap;margin-bottom:14px;
  }
  h1{margin:0;font-size:clamp(28px,5vw,36px)}
  .mode-buttons,.toolbar,.type-buttons,.ws-controls{
    display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  }
  .toolbar{justify-content:space-between;margin-bottom:14px}
  button,select,input{font:inherit}
  button,select{
    border:1px solid var(--border);border-radius:10px;background:var(--panel);
    color:var(--text);padding:9px 13px;
  }
  button{cursor:pointer;font-weight:650}
  button:hover{border-color:var(--accent)}
  button:focus-visible,input:focus-visible,select:focus-visible{
    outline:3px solid var(--focus);outline-offset:2px;
  }
  button[aria-pressed="true"],button.primary{
    background:var(--accent);color:#fff;border-color:var(--accent);
  }
  .panel{
    background:var(--panel);border:1px solid var(--border);
    border-radius:16px;padding:18px;
  }
  .practice{display:grid;gap:14px}
  .diagram-wrap{text-align:center}
  svg{width:min(330px,100%);height:auto}
  .question{
    text-align:center;font-size:clamp(22px,4vw,28px);font-weight:700;
  }
  .given{text-align:center;color:var(--muted);font-size:17px}
  .note{text-align:center;color:var(--muted);font-size:14px}
  .answer-row{
    display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;
  }
  input[type="text"]{
    width:min(240px,100%);font-size:21px;text-align:center;
    padding:10px 11px;border:1px solid var(--border);border-radius:9px;
    background:var(--panel);color:var(--text);
  }
  .feedback{
    min-height:28px;text-align:center;font-size:18px;font-weight:700;
  }
  .feedback.correct{color:var(--good)}
  .feedback.incorrect{color:var(--bad)}
  .steps{
    max-width:620px;width:100%;margin:0 auto;background:var(--accent-soft);
    border:1px solid var(--border);border-radius:11px;padding:11px 13px;
    white-space:pre-line;
  }
  .stats{
    display:flex;justify-content:center;gap:20px;color:var(--muted);font-size:15px;
  }
  .worksheet{display:none}
  .ws-controls{margin-bottom:14px}
  .ws-list{display:grid;gap:18px}
  .ws-item{
    border-bottom:1px solid var(--border);padding-bottom:16px;
    break-inside:avoid;
  }
  .ws-row{
    display:grid;grid-template-columns:minmax(180px,260px) 1fr;gap:14px;align-items:center;
  }
  .ws-svg{width:240px;max-width:100%}
  .ws-text{font-size:16px}
  .ws-answer{display:none;margin-top:8px;font-weight:700;color:var(--good)}
  .ws-reveal{margin-top:8px;padding:6px 10px;font-size:14px}
  footer{text-align:center;color:var(--muted);font-size:14px;margin-top:18px}
  .sr-only{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}
  @media(max-width:620px){
    .app{padding:13px}.panel{padding:14px}.ws-row{grid-template-columns:1fr}
    .answer-row{align-items:stretch}
    input[type="text"],.answer-row button{width:100%}
  }
  @media print{
    header,.toolbar,footer,.ws-controls,.ws-reveal{display:none!important}
    body{background:#fff;color:#000}
    .app{max-width:none;padding:0}.panel{border:0;padding:0;background:#fff}
    .worksheet{display:block!important}
    .ws-item{page-break-inside:avoid}
    .ws-answer{display:none!important}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Circumference &amp; Area of Circles</h1>
    <div class="mode-buttons" role="group" aria-label="Mode">
      <button id="practiceBtn" aria-pressed="true">Practice</button>
      <button id="worksheetBtn" aria-pressed="false">Worksheet</button>
    </div>
  </header>

  <div class="toolbar">
    <div class="type-buttons" id="types" role="group" aria-label="Question type">
      <button data-type="circumference" aria-pressed="true">Circumference</button>
      <button data-type="area" aria-pressed="false">Area</button>
      <button data-type="mixed" aria-pressed="false">Mixed</button>
    </div>
    <button id="contrastBtn" aria-pressed="false">High contrast</button>
  </div>

  <section id="practice" class="panel practice" aria-label="Practice mode">
    <div class="diagram-wrap">
      <svg id="diagram" viewBox="0 0 260 260" role="img" aria-label="Circle diagram"></svg>
    </div>

    <div id="question" class="question" aria-live="polite"></div>
    <div id="given" class="given"></div>
    <div class="note">Use π = 3.14. Round to the nearest whole number. Do not enter units.</div>

    <div class="answer-row">
      <input id="answer" type="text" inputmode="numeric" autocomplete="off"
             aria-label="Your answer" placeholder="Enter answer">
      <button id="check" class="primary">Check</button>
      <button id="next" hidden>Next</button>
    </div>

    <div id="feedback" class="feedback" aria-live="polite"></div>
    <button id="showSteps" hidden style="justify-self:center">Show steps</button>
    <div id="steps" class="steps" hidden></div>

    <div class="stats">
      <span>Correct: <strong id="correctCount">0</strong></span>
      <span>Incorrect: <strong id="incorrectCount">0</strong></span>
    </div>
  </section>

  <section id="worksheet" class="panel worksheet" aria-label="Worksheet mode">
    <div class="ws-controls">
      <label for="wsType">Question type:</label>
      <select id="wsType">
        <option value="circumference">Circumference</option>
        <option value="area">Area</option>
        <option value="mixed">Mixed</option>
      </select>

      <label for="wsCount">Questions:</label>
      <select id="wsCount">
        <option value="5">5</option>
        <option value="10" selected>10</option>
        <option value="15">15</option>
      </select>

      <button id="generateWs">Generate</button>
      <button id="revealAll">Reveal all</button>
      <button id="hideAll">Hide all</button>
      <button id="printWs">Print</button>
    </div>

    <div class="note" style="text-align:left;margin-bottom:14px">
      Use π = 3.14 and round each answer to the nearest whole number.
    </div>
    <div id="wsList" class="ws-list"></div>
  </section>

  <footer>Created by Mr. McLean Math</footer>
  <div id="live" class="sr-only" aria-live="assertive"></div>
</div>

<script>
const SVG_NS='http://www.w3.org/2000/svg';
const PI=3.14;
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));

const state={
  mode:'practice',
  type:'circumference',
  current:null,
  evaluated:false,
  correct:0,
  incorrect:0,
  recentKeys:[]
};

function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min}

function generateQuestion(type=state.type,trackRecent=true){
  const kind=type==='mixed'
    ? (Math.random()<0.5?'circumference':'area')
    : type;

  let q,tries=0;
  do{
    const givenType=Math.random()<0.5?'r':'d';
    let radius,diameter;
    if(givenType==='r'){
      radius=randInt(2,20);
      diameter=2*radius;
    }else{
      radius=randInt(2,20);
      diameter=2*radius;
    }

    const raw=kind==='circumference'
      ? (givenType==='r' ? 2*PI*radius : PI*diameter)
      : PI*radius*radius;

    const givenValue=givenType==='r'?radius:diameter;
    q={
      kind,givenType,givenValue,radius,diameter,
      rawValue:raw,
      correctRounded:Math.round(raw),
      key:givenType+':'+givenValue
    };
    tries++;
  }while(trackRecent && state.recentKeys.includes(q.key) && tries<30);

  if(trackRecent){
    state.recentKeys.push(q.key);
    if(state.recentKeys.length>8)state.recentKeys.shift();
  }
  return q;
}

function clearSvg(svg){while(svg.firstChild)svg.removeChild(svg.firstChild)}

function svgEl(name,attrs={}){
  const el=document.createElementNS(SVG_NS,name);
  for(const [k,v] of Object.entries(attrs))el.setAttribute(k,String(v));
  return el;
}

function drawCircle(svg,q){
  clearSvg(svg);
  const cx=130,cy=130,rPx=78;
  const style=getComputedStyle(document.body);
  const stroke=style.getPropertyValue('--diagram').trim()||'#444';
  const fill=q.kind==='area'
    ? (style.getPropertyValue('--area-fill').trim()||'#dff3df')
    : 'transparent';

  svg.appendChild(svgEl('circle',{
    cx,cy,r:rPx,fill,stroke,'stroke-width':3
  }));

  const isRadius=q.givenType==='r';
  const x1=isRadius?cx:cx-rPx;
  const x2=cx+rPx;
  svg.appendChild(svgEl('line',{
    x1,y1:cy,x2,y2:cy,stroke,'stroke-width':3
  }));

  const label=svgEl('text',{
    x:(x1+x2)/2,y:cy-14,'font-size':15,'text-anchor':'middle',fill:stroke
  });
  label.textContent=(isRadius?'r':'d')+' = '+q.givenValue+' cm';
  svg.appendChild(label);
}

function questionText(q){
  return q.kind==='circumference'
    ? 'Calculate the circumference of the circle.'
    : 'Calculate the area of the circle.';
}

function parseWholeAnswer(raw){
  const s=raw.trim().replace(/\s+/g,'');
  if(!s || !/^[+]?\d+$/.test(s))return null;
  const n=Number(s);
  return Number.isSafeInteger(n)?n:null;
}

function announce(msg){
  const el=$('#live');el.textContent='';
  setTimeout(()=>el.textContent=msg,10);
}

function newQuestion(){
  state.current=generateQuestion();
  state.evaluated=false;
  drawCircle($('#diagram'),state.current);
  $('#question').textContent=questionText(state.current);
  $('#given').textContent=
    'Given: '+(state.current.givenType==='r'?'radius':'diameter')+
    ' = '+state.current.givenValue+' cm';

  $('#answer').value='';
  $('#answer').disabled=false;
  $('#check').disabled=false;
  $('#next').hidden=true;
  $('#feedback').textContent='';
  $('#feedback').className='feedback';
  $('#showSteps').hidden=true;
  $('#steps').hidden=true;
  $('#steps').textContent='';
  $('#answer').focus();
}

function stepsText(q){
  if(q.kind==='circumference'){
    if(q.givenType==='r'){
      return `Formula: C = 2 × π × r
Substitute: C = 2 × 3.14 × ${q.radius}
Calculate: C = ${q.rawValue.toFixed(2)}
Round to the nearest whole number: ${q.correctRounded} cm`;
    }
    return `Formula: C = π × d
Substitute: C = 3.14 × ${q.diameter}
Calculate: C = ${q.rawValue.toFixed(2)}
Round to the nearest whole number: ${q.correctRounded} cm`;
  }

  if(q.givenType==='d'){
    return `First find the radius: r = d ÷ 2 = ${q.diameter} ÷ 2 = ${q.radius} cm
Formula: A = π × r²
Substitute: A = 3.14 × ${q.radius}²
Calculate: A = ${q.rawValue.toFixed(2)}
Round to the nearest whole number: ${q.correctRounded} cm²`;
  }
  return `Formula: A = π × r²
Substitute: A = 3.14 × ${q.radius}²
Calculate: A = ${q.rawValue.toFixed(2)}
Round to the nearest whole number: ${q.correctRounded} cm²`;
}

function checkAnswer(){
  if(state.evaluated)return;

  const value=parseWholeAnswer($('#answer').value);
  if(value===null){
    $('#feedback').textContent='Enter a whole-number answer first.';
    $('#feedback').className='feedback incorrect';
    announce('Enter a whole-number answer first.');
    return;
  }

  state.evaluated=true;
  $('#answer').disabled=true;
  $('#check').disabled=true;
  $('#next').hidden=false;

  if(value===state.current.correctRounded){
    state.correct++;
    $('#feedback').textContent='Correct!';
    $('#feedback').className='feedback correct';
    announce('Correct');
  }else{
    state.incorrect++;
    const units=state.current.kind==='circumference'?'cm':'cm²';
    $('#feedback').textContent=
      `Incorrect. Correct answer: ${state.current.correctRounded} ${units}`;
    $('#feedback').className='feedback incorrect';
    $('#showSteps').hidden=false;
    announce('Incorrect');
  }

  $('#correctCount').textContent=state.correct;
  $('#incorrectCount').textContent=state.incorrect;
}

$('#showSteps').addEventListener('click',()=>{
  $('#steps').textContent=stepsText(state.current);
  $('#steps').hidden=false;
  $('#showSteps').hidden=true;
});
$('#check').addEventListener('click',checkAnswer);
$('#next').addEventListener('click',newQuestion);
$('#answer').addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    e.preventDefault();
    if(state.evaluated)newQuestion();
    else checkAnswer();
  }else if(e.key==='Escape'&&!state.evaluated){
    $('#answer').value='';
  }
});

$('#types').addEventListener('click',e=>{
  const btn=e.target.closest('button[data-type]');if(!btn)return;
  state.type=btn.dataset.type;
  state.recentKeys=[];
  $$('#types button').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)));
  if(state.mode==='practice')newQuestion();
});

function setMode(mode){
  state.mode=mode;
  const practice=mode==='practice';
  $('#practice').style.display=practice?'grid':'none';
  $('#worksheet').style.display=practice?'none':'block';
  $('#practiceBtn').setAttribute('aria-pressed',String(practice));
  $('#worksheetBtn').setAttribute('aria-pressed',String(!practice));
  if(practice){
    newQuestion();
  }else{
    $('#wsType').value=state.type;
    if(!$('#wsList').children.length)renderWorksheet();
  }
}
$('#practiceBtn').addEventListener('click',()=>setMode('practice'));
$('#worksheetBtn').addEventListener('click',()=>setMode('worksheet'));

$('#contrastBtn').addEventListener('click',()=>{
  const on=document.body.classList.toggle('high-contrast');
  $('#contrastBtn').setAttribute('aria-pressed',String(on));
  if(state.mode==='practice'&&state.current)drawCircle($('#diagram'),state.current);
  $$('#wsList .ws-svg').forEach((svg,i)=>{
    const q=svg._question;
    if(q)drawCircle(svg,q);
  });
});

function renderWorksheet(){
  const list=$('#wsList');
  list.innerHTML='';
  const type=$('#wsType').value;
  const count=Number($('#wsCount').value)||10;
  const recent=[];

  for(let i=1;i<=count;i++){
    let q,tries=0;
    do{
      q=generateQuestion(type,false);
      tries++;
    }while(recent.includes(q.key)&&tries<30);
    recent.push(q.key);
    if(recent.length>8)recent.shift();

    const item=document.createElement('div');
    item.className='ws-item';

    const row=document.createElement('div');
    row.className='ws-row';

    const svg=svgEl('svg',{viewBox:'0 0 260 260'});
    svg.classList.add('ws-svg');
    svg._question=q;
    drawCircle(svg,q);

    const text=document.createElement('div');
    text.className='ws-text';
    const units=q.kind==='circumference'?'cm':'cm²';
    text.innerHTML=`
      <strong>${i}. ${questionText(q)}</strong>
      <div style="margin-top:6px">Use π = 3.14 and round to the nearest whole number.</div>
      <div style="margin-top:12px">Answer: ____________________</div>
      <button class="ws-reveal" aria-expanded="false">Reveal</button>
      <div class="ws-answer">Answer: ${q.correctRounded} ${units}</div>`;

    const reveal=text.querySelector('.ws-reveal');
    const answer=text.querySelector('.ws-answer');
    reveal.addEventListener('click',()=>{
      const showing=answer.style.display==='block';
      answer.style.display=showing?'none':'block';
      reveal.textContent=showing?'Reveal':'Hide';
      reveal.setAttribute('aria-expanded',String(!showing));
    });

    row.append(svg,text);
    item.append(row);
    list.append(item);
  }
}

$('#generateWs').addEventListener('click',renderWorksheet);
$('#revealAll').addEventListener('click',()=>{
  $$('#wsList .ws-answer').forEach(a=>a.style.display='block');
  $$('#wsList .ws-reveal').forEach(b=>{
    b.textContent='Hide';b.setAttribute('aria-expanded','true');
  });
});
$('#hideAll').addEventListener('click',()=>{
  $$('#wsList .ws-answer').forEach(a=>a.style.display='none');
  $$('#wsList .ws-reveal').forEach(b=>{
    b.textContent='Reveal';b.setAttribute('aria-expanded','false');
  });
});
$('#printWs').addEventListener('click',()=>window.print());

function runDevTests(){
  const failures=[];
  const assert=(name,cond)=>{if(!cond)failures.push(name)};

  for(const type of ['circumference','area','mixed']){
    for(let i=0;i<50000;i++){
      const q=generateQuestion(type,false);
      assert('radius range',q.radius>=2&&q.radius<=20);
      assert('diameter even range',q.diameter>=4&&q.diameter<=40&&q.diameter%2===0);
      if(type!=='mixed')assert('type preserved',q.kind===type);

      const expected=q.kind==='circumference'
        ? Math.round(q.givenType==='r'?2*3.14*q.radius:3.14*q.diameter)
        : Math.round(3.14*q.radius*q.radius);
      assert('answer correct',q.correctRounded===expected);
    }
  }

  assert('blank rejected',parseWholeAnswer('')===null);
  assert('decimal final rejected',parseWholeAnswer('62.4')===null);
  assert('whole accepted',parseWholeAnswer('62')===62);
  console.log(failures.length?'DEV TESTS: FAIL':'DEV TESTS: PASS',failures);
}

newQuestion();
if(new URLSearchParams(location.search).get('dev')==='1')runDevTests();
</script>
</body>
</html>
